<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Warun – panel admina</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Te same tokeny co tablica prognozy */
:root{
  --bg:#eaf0f2; --surface:#ffffff; --ink:#132630; --muted:#566973; --line:#d0dadf;
  --accent:#17708c; --go:#278a52; --warn:#c07c08; --no:#b9433a;
  --go-bg:rgba(39,138,82,.16); --no-bg:rgba(185,67,58,.12); --warn-soft:rgba(192,124,8,.12);
  --font-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-data:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c161b; --surface:#13222a; --ink:#e2ebef; --muted:#8ea2ac; --line:#24363f;
  --accent:#5db6d2; --go:#47bd78; --warn:#e3a43a; --no:#e06a5f;
  --go-bg:rgba(71,189,120,.16); --no-bg:rgba(224,106,95,.12); --warn-soft:rgba(227,164,58,.12); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c161b; --surface:#13222a; --ink:#e2ebef; --muted:#8ea2ac; --line:#24363f;
  --accent:#5db6d2; --go:#47bd78; --warn:#e3a43a; --no:#e06a5f;
  --go-bg:rgba(71,189,120,.16); --no-bg:rgba(224,106,95,.12); --warn-soft:rgba(227,164,58,.12); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body)}
[hidden]{display:none!important}
.wrap{max-width:860px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--font-display);font-weight:700;margin:0;letter-spacing:.01em}
h1{font-size:2.2rem;line-height:1} h2{font-size:1.35rem;line-height:1.1}
.eyebrow{font-family:var(--font-data);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .mono{font-family:var(--font-data);font-variant-numeric:tabular-nums}
a{color:var(--accent)}
.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
form{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end}
label{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--muted);flex:1 1 160px}
input{font:15px var(--font-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{font:600 1rem var(--font-display);letter-spacing:.04em;border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:999px;padding:7px 18px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.lnk{color:var(--accent);font:500 .88rem var(--font-body);background:none;border:0;padding:0;cursor:pointer}
.lnk.no{color:var(--no)} .lnk:hover{text-decoration:underline}
.msg{border-radius:10px;padding:10px 14px;font-size:.92rem}
.msg.err{background:var(--no-bg);color:var(--no)} .msg.ok{background:var(--go-bg)} .msg.warn{background:var(--warn-soft);border:1px solid var(--warn)}
.secret{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.secret .pw{font-family:var(--font-data);font-size:1.3rem;letter-spacing:.04em;user-select:all}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:.78rem}
td.acts{text-align:right}
td.acts .row{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:flex-end}
.tag{display:inline-block;font-family:var(--font-data);font-size:.62rem;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin:2px 4px 0 0}
.tag.admin{border-color:var(--accent);color:var(--accent)} .tag.off{border-color:var(--no);color:var(--no)} .tag.tmp{border-color:var(--warn);color:var(--warn)}
.sub{font-size:.78rem;color:var(--muted)}
</style>
</head><body>
<div class="wrap">
  <div class="top">
    <div><span class="eyebrow">Warun Pomorze</span><h1>Panel admina</h1></div>
    <a href="./">← Prognoza</a>
  </div>

  <div id="gate" class="msg warn" hidden></div>

  <div id="app" hidden>
    <div style="display:flex;flex-direction:column;gap:18px">
      <div id="secret" class="msg ok" hidden></div>

      <section class="card">
        <h2>Nowe konto</h2>
        <form id="add" novalidate>
          <label>Login<input name="login" autocapitalize="none" autocomplete="off" spellcheck="false" placeholder="np. jan" required></label>
          <label>Imię i nazwisko (opcjonalnie)<input name="name" autocomplete="off"></label>
          <button class="btn" type="submit">Załóż konto</button>
        </form>
        <div id="addMsg" hidden></div>
        <span class="sub">Hasło startowe pojawi się na górze. Przekaż je osobie – przy pierwszym logowaniu ustawi własne.</span>
      </section>

      <section class="card">
        <h2>Konta</h2>
        <div id="listMsg" hidden></div>
        <div style="overflow-x:auto"><table>
          <thead><tr><th>Login</th><th>Ostatnio</th><th></th></tr></thead>
          <tbody id="users"><tr><td colspan="3" class="muted">Wczytuję…</td></tr></tbody>
        </table></div>
      </section>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
"use strict";
const CFG = window.WARUN_CONFIG || {};
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const when = t => t ? new Date(t).toLocaleString("pl-PL", {timeZone: "Europe/Warsaw", day: "numeric", month: "numeric", year: "2-digit", hour: "2-digit", minute: "2-digit"}) : "nigdy";
function show(el, kind, html) { el.className = "msg " + kind; el.innerHTML = html; el.hidden = false; }
function gate(html) { show($("gate"), "warn", html); $("gate").hidden = false; $("app").hidden = true; }

if (!CFG.supabaseUrl || !window.supabase) { gate("Brak konfiguracji Supabase."); return; }
const SB = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
let USERS = [], ASK = null;   // ASK = {id, action} czekające na potwierdzenie

async function call(body) {
  const {data, error} = await SB.functions.invoke("admin", {body});
  if (error) {
    let msg = error.message;
    try { const j = await error.context.json(); if (j && j.error) msg = j.error; } catch (e) {}
    throw new Error(msg);
  }
  return data;
}

function showSecret(login, pw, what) {
  $("secret").innerHTML = `<div><strong>${esc(what)} dla <span class="mono">${esc(login)}</span></strong></div>
    <div class="secret"><span class="pw">${esc(pw)}</span><button type="button" class="btn ghost" id="copy">Kopiuj</button></div>
    <span class="sub">Skopiuj teraz – hasło nie będzie pokazane ponownie.</span>`;
  $("secret").className = "msg ok"; $("secret").hidden = false;
  $("copy").addEventListener("click", async e => {
    try { await navigator.clipboard.writeText(pw); e.target.textContent = "Skopiowane"; } catch (err) { e.target.textContent = "Zaznacz i skopiuj ręcznie"; }
  });
  $("secret").scrollIntoView({behavior: "smooth", block: "start"});
}

const LABEL = {reset: "Nowe hasło startowe?", disable: "Zablokować konto?", enable: "Odblokować konto?", delete: "Usunąć konto i jego skrzydła?"};

function render() {
  $("users").innerHTML = USERS.map(u => {
    const tags = (u.admin ? '<span class="tag admin">admin</span>' : "") + (u.disabled ? '<span class="tag off">zablokowane</span>' : "")
      + (u.must_change ? '<span class="tag tmp">hasło startowe</span>' : "") + (u.me ? '<span class="tag">to ty</span>' : "");
    let acts;
    if (ASK && ASK.id === u.id) {
      acts = `<div class="row"><span>${LABEL[ASK.action]}</span><button type="button" class="lnk no" data-a="yes" data-id="${esc(u.id)}">Tak</button><button type="button" class="lnk" data-a="no">Nie</button></div>`;
    } else if (u.me) {
      acts = '<span class="sub">hasło zmieniasz na stronie głównej</span>';
    } else {
      acts = `<div class="row"><button type="button" class="lnk" data-a="reset" data-id="${esc(u.id)}">Reset hasła</button>
        <button type="button" class="lnk" data-a="${u.disabled ? "enable" : "disable"}" data-id="${esc(u.id)}">${u.disabled ? "Odblokuj" : "Zablokuj"}</button>
        <button type="button" class="lnk no" data-a="delete" data-id="${esc(u.id)}">Usuń</button></div>`;
    }
    return `<tr><td><strong class="mono">${esc(u.login)}</strong>${u.display_name ? `<div class="sub">${esc(u.display_name)}</div>` : ""}<div>${tags}</div></td>
      <td class="mono sub">${when(u.last_sign_in_at)}</td><td class="acts">${acts}</td></tr>`;
  }).join("") || '<tr><td colspan="3" class="muted">Brak kont.</td></tr>';
}

async function load() {
  USERS = (await call({action: "list"})).users;
  render();
}

$("users").addEventListener("click", async e => {
  const b = e.target.closest("[data-a]"); if (!b) return;
  const a = b.dataset.a; $("listMsg").hidden = true;
  if (a === "no") { ASK = null; return render(); }
  if (a !== "yes") { ASK = {id: b.dataset.id, action: a}; return render(); }
  const {id, action} = ASK; ASK = null;
  const u = USERS.find(x => x.id === id);
  b.disabled = true;
  try {
    const r = await call({action, id});
    if (action === "reset") showSecret(u.login, r.password, "Nowe hasło startowe");
    else show($("listMsg"), "ok", esc({disable: "Zablokowano ", enable: "Odblokowano ", delete: "Usunięto "}[action] + u.login + "."));
    await load();
  } catch (err) { show($("listMsg"), "err", esc(err.message)); render(); }
});

$("add").addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target, btn = f.querySelector("button"); btn.disabled = true; $("addMsg").hidden = true;
  try {
    const r = await call({action: "create", login: f.login.value, display_name: f.name.value});
    showSecret(r.login, r.password, "Hasło startowe");
    f.reset(); await load();
  } catch (err) { show($("addMsg"), "err", esc(err.message)); }
  finally { btn.disabled = false; }
});

(async () => {
  const {data} = await SB.auth.getSession();
  const user = data.session && data.session.user;
  if (!user) return gate('Najpierw <a href="./">zaloguj się na stronie głównej</a>, potem wróć tutaj.');
  if (!user.app_metadata || user.app_metadata.role !== "admin") return gate('To konto nie ma uprawnień admina. <a href="./">Wróć do prognozy</a>.');
  $("gate").hidden = true; $("app").hidden = false;
  try { await load(); } catch (err) { show($("listMsg"), "err", esc(err.message)); $("users").innerHTML = ""; }
})();
})();
</script>
</body></html>
